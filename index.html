<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجلّي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--surface:#141417;--surface2:#1c1c21;--surface3:#232329;
  --border:#2a2a32;--border-glow:#3a3a48;
  --text:#e8e6f0;--text-muted:#7a7890;--text-faint:#3d3c50;
  --accent:#c9a84c;--accent-dim:#8a6e2e;--accent-glow:rgba(201,168,76,0.12);
  --red:#c96b6b;--red-dim:rgba(201,107,107,0.15);
  --green:#6bc98a;--blue:#6b9bc9;--purple:#9b6bc9;
  --mono:'IBM Plex Mono',monospace;--sans:'Cairo',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);}

/* ══ LOCK ══ */
#lockScreen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px 40px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:lockIn .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes lockIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.lock-icon{font-size:2.4rem;margin-bottom:18px;display:block;}
.lock-title{font-size:1.5rem;font-weight:700;margin-bottom:6px;}
.lock-sub{font-size:.82rem;color:var(--text-muted);margin-bottom:28px;}
#passInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 18px;color:var(--text);font-family:var(--mono);font-size:1.3rem;letter-spacing:6px;text-align:center;outline:none;transition:border-color .2s;caret-color:var(--accent);margin-bottom:10px;}
#passInput:focus{border-color:var(--accent-dim);}
#passInput.error{border-color:var(--red);animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lockError{font-size:.8rem;color:var(--red);margin-bottom:14px;min-height:18px;}
.lock-btn{width:100%;background:var(--accent);color:#0d0d0f;border:none;border-radius:10px;padding:13px;font-family:var(--sans);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
.lock-btn:hover{background:#d9b85c;transform:translateY(-1px);}

/* ══ APP SHELL ══ */
#app{display:none;position:fixed;inset:0;background:var(--bg);}
#app.visible{display:flex;flex-direction:column;}

/* ══ TOP BAR ══ */
#topBar{
  height:48px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 12px;
  z-index:100;
}
.app-title{font-size:1rem;font-weight:700;background:linear-gradient(135deg,#e8e6f0,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-left:auto;}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .18s;flex-shrink:0;}
.icon-btn:hover{border-color:var(--border-glow);color:var(--text);background:var(--surface2);}
.icon-btn.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow);}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;transition:background .4s;}
.status-dot.ok{background:var(--green);}
.status-dot.err{background:var(--red);}
.status-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ══ WORKSPACE ══ */
#workspace{flex:1;display:flex;overflow:hidden;position:relative;}

/* ══ EDITOR MODE ══ */
#editorPane{
  flex:1;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden;
}
#editorPane.hidden{display:none;}

/* FORMAT TOOLBAR */
#fmtBar{
  height:40px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:4px;padding:0 12px;
}
.fmt-btn{
  height:28px;min-width:28px;padding:0 8px;
  border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--text-muted);
  cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .15s;white-space:nowrap;
}
.fmt-btn:hover{background:var(--surface2);border-color:var(--border);color:var(--text);}
.fmt-btn.active{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent);}
.fmt-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.color-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:transform .15s;flex-shrink:0;}
.color-dot:hover{transform:scale(1.3);}
.color-dot.active{border-color:white;transform:scale(1.15);}

/* CONTENT EDITABLE */
#editor{
  flex:1;overflow-y:auto;padding:48px 60px;
  outline:none;font-size:1.05rem;line-height:1.9;caret-color:var(--accent);
  color:var(--text);
}
#editor:empty::before{content:attr(data-placeholder);color:var(--text-faint);pointer-events:none;}
#editor b,#editor strong{font-weight:700;}
#editor u{text-decoration:underline;}
#editor [style*="color"]{} /* allow inline colors */

/* EDITOR FOOTER */
#editorFooter{
  height:40px;flex-shrink:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:11px;color:var(--text-faint);font-family:var(--mono);
}
#saveEntryBtn{
  background:var(--accent);color:#0d0d0f;border:none;border-radius:6px;
  padding:5px 16px;font-family:var(--sans);font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
#saveEntryBtn:hover{background:#d9b85c;}
#saveEntryBtn:disabled{opacity:.4;cursor:not-allowed;}

/* ══ MIND MAP MODE ══ */
#mindPane{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
#mindPane.hidden{display:none;}
#mindCanvas{flex:1;width:100%;cursor:grab;position:relative;overflow:hidden;}
#mindCanvas.grabbing{cursor:grabbing;}
#mindCanvas svg{position:absolute;inset:0;width:100%;height:100%;}
#mindToolbar{
  height:44px;flex-shrink:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 14px;
}
.mind-btn{
  font-family:var(--sans);font-size:12px;font-weight:600;
  padding:6px 14px;border:1px solid var(--border);border-radius:7px;
  background:transparent;color:var(--text-muted);cursor:pointer;
  transition:all .18s;white-space:nowrap;
}
.mind-btn:hover{border-color:var(--border-glow);color:var(--text);}
.mind-btn.accent{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow);}
.mind-btn.accent:hover{background:rgba(201,168,76,.2);}
#mindSavebtn{
  margin-right:auto;background:var(--accent);color:#0d0d0f;border:none;
  border-radius:7px;padding:6px 16px;font-family:var(--sans);font-size:12px;
  font-weight:700;cursor:pointer;transition:all .2s;
}
#mindSavebtn:hover{background:#d9b85c;}

/* Node edit tooltip */
#nodeEditBox{
  position:absolute;z-index:300;background:var(--surface);
  border:1px solid var(--accent-dim);border-radius:8px;
  padding:6px 10px;display:none;flex-direction:column;gap:4px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:180px;
}
#nodeEditBox input{
  background:transparent;border:none;border-bottom:1px solid var(--border);
  color:var(--text);font-family:var(--sans);font-size:.9rem;
  outline:none;padding:4px;caret-color:var(--accent);width:100%;
}
#nodeEditBox .node-edit-actions{display:flex;gap:6px;}
.nea-btn{font-family:var(--sans);font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s;flex:1;}
.nea-btn:hover{border-color:var(--border-glow);color:var(--text);}
.nea-btn.accent{color:var(--accent);border-color:var(--accent-dim);}
.nea-btn.danger{color:var(--red);border-color:var(--red);}

/* ══ SIDEBAR (JOURNAL LIST) ══ */
#sidebar{
  width:300px;flex-shrink:0;border-right:1px solid var(--border);
  background:var(--surface);display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.16,1,.3,1);
  position:absolute;right:0;top:0;bottom:0;z-index:200;
  transform:translateX(0);
}
#sidebar.hidden{transform:translateX(100%);}
#sidebarHeader{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
#sidebarHeader h2{font-size:.95rem;font-weight:700;color:var(--accent);}
#searchInput{
  width:calc(100% - 32px);margin:10px 16px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;color:var(--text);font-family:var(--sans);font-size:12px;
  outline:none;transition:border-color .2s;flex-shrink:0;
}
#searchInput:focus{border-color:var(--accent-dim);}
#searchInput::placeholder{color:var(--text-faint);}
#filterRow{display:flex;gap:4px;padding:0 16px 10px;flex-wrap:wrap;flex-shrink:0;}
.flt-btn{font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-faint);cursor:pointer;transition:all .15s;}
.flt-btn.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow);}
#entryList{flex:1;overflow-y:auto;padding:0 16px 16px;}
.entry-item{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:all .18s;position:relative;
}
.entry-item:hover{border-color:var(--border-glow);}
.entry-item.active{border-color:var(--accent-dim);background:var(--accent-glow);}
.entry-item .ei-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;
  margin-bottom:5px;letter-spacing:.5px;
}
.ei-badge.text{background:rgba(201,168,76,.1);color:var(--accent);}
.ei-badge.mind{background:rgba(107,155,201,.1);color:var(--blue);}
.entry-item .ei-preview{font-size:11px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.entry-item .ei-time{font-size:9px;color:var(--text-faint);font-family:var(--mono);margin-top:5px;}
.entry-item .ei-del{position:absolute;top:8px;left:8px;width:22px;height:22px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--text-faint);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s;}
.entry-item:hover .ei-del{opacity:1;}
.entry-item .ei-del:hover{border-color:var(--red);color:var(--red);background:var(--red-dim);}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface3);border:1px solid var(--border-glow);color:var(--text);font-size:13px;font-weight:600;padding:9px 20px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;transition:transform .3s,opacity .3s;opacity:0;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.success{border-color:var(--green);color:var(--green);}
#toast.error{border-color:var(--red);color:var(--red);}

/* ══ OVERLAY ══ */
#sideOverlay{position:absolute;inset:0;z-index:199;display:none;}
#sideOverlay.show{display:block;}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:2px;}
@media(max-width:600px){#editor{padding:24px 20px;}}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon">🔒</span>
    <div class="lock-title">سجلّي الخاص</div>
    <div class="lock-sub">أدخل كلمة المرور للدخول</div>
    <input type="password" id="passInput" maxlength="10" placeholder="••••" autocomplete="off"
      oninput="document.getElementById('lockError').textContent=''"
      onkeydown="if(event.key==='Enter')checkPass()">
    <div id="lockError"></div>
    <button class="lock-btn" onclick="checkPass()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOP BAR -->
  <div id="topBar">
    <!-- Mode btns -->
    <button class="icon-btn active" id="modeEditor" onclick="setMode('editor')" title="محرر النصوص">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="icon-btn" id="modeMind" onclick="setMode('mind')" title="الخريطة الذهنية">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 9V3M12 21v-6M9 12H3M21 12h-6M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/></svg>
    </button>
    <div class="sep"></div>
    <!-- New entry -->
    <button class="icon-btn" onclick="newEntry()" title="سجل جديد">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <!-- Journal list -->
    <button class="icon-btn" id="sidebarToggle" onclick="toggleSidebar()" title="السجلات">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <div class="sep"></div>
    <span class="status-dot" id="statusDot"></span>
    <span style="font-size:11px;color:var(--text-faint);font-family:var(--mono)" id="statusText">...</span>
    <div class="app-title">سجلّي</div>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace">
    <!-- EDITOR PANE -->
    <div id="editorPane">
      <!-- FORMAT BAR -->
      <div id="fmtBar">
        <button class="fmt-btn" id="fmtBold" onclick="execFmt('bold')" title="عريض"><b>ع</b></button>
        <button class="fmt-btn" id="fmtUnder" onclick="execFmt('underline')" title="تسطير"><u>ع</u></button>
        <div class="fmt-sep"></div>
        <!-- Colors -->
        <div style="display:flex;align-items:center;gap:6px;margin:0 4px">
          <span style="font-size:10px;color:var(--text-faint)">لون:</span>
          <div class="color-dot active" id="cdDefault" style="background:var(--text)" onclick="setColor('')" title="افتراضي"></div>
          <div class="color-dot" id="cdGold" style="background:#c9a84c" onclick="setColor('#c9a84c')" title="ذهبي"></div>
          <div class="color-dot" id="cdBlue" style="background:#6b9bc9" onclick="setColor('#6b9bc9')" title="أزرق"></div>
          <div class="color-dot" id="cdGreen" style="background:#6bc98a" onclick="setColor('#6bc98a')" title="أخضر"></div>
          <div class="color-dot" id="cdRed" style="background:#c96b6b" onclick="setColor('#c96b6b')" title="أحمر"></div>
          <div class="color-dot" id="cdPurple" style="background:#9b6bc9" onclick="setColor('#9b6bc9')" title="بنفسجي"></div>
        </div>
        <div class="fmt-sep"></div>
        <span style="font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-right:auto" id="wordCount">0 كلمة</span>
      </div>
      <!-- EDITOR -->
      <div id="editor" contenteditable="true" data-placeholder="ابدأ الكتابة هنا..."></div>
      <!-- FOOTER -->
      <div id="editorFooter">
        <span id="charCount">0 حرف</span>
        <button id="saveEntryBtn" onclick="saveEditorEntry()">✦ حفظ السجل</button>
      </div>
    </div>

    <!-- MIND MAP PANE -->
    <div id="mindPane" class="hidden">
      <div id="mindCanvas">
        <svg id="mindSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="mindToolbar">
        <button id="mindSavebtn" onclick="saveMindEntry()">🌿 حفظ الخريطة</button>
        <button class="mind-btn" onclick="mindAddChild()" title="إضافة فرع للعقدة المحددة">+ فرع</button>
        <button class="mind-btn" onclick="mindAddSibling()" title="إضافة عقدة مجاورة">+ مجاور</button>
        <button class="mind-btn" onclick="mindToggleCollapse()">إخفاء/إظهار الفروع</button>
        <button class="mind-btn" onclick="mindDeleteSelected()">🗑 حذف</button>
        <div class="sep"></div>
        <button class="mind-btn" onclick="mindReset()">خريطة جديدة</button>
        <div style="margin-right:auto;font-size:11px;color:var(--text-faint)">اسحب لتحريك · دبل-كليك لتعديل · كليك للتحديد</div>
      </div>
      <!-- Node edit box -->
      <div id="nodeEditBox">
        <input type="text" id="nodeEditInput" placeholder="نص العقدة..." onkeydown="nodeEditKey(event)">
        <div class="node-edit-actions">
          <button class="nea-btn accent" onclick="confirmNodeEdit()">حفظ</button>
          <button class="nea-btn" onclick="closeNodeEdit()">إلغاء</button>
          <button class="nea-btn danger" onclick="mindDeleteSelected();closeNodeEdit()">حذف</button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR OVERLAY -->
    <div id="sideOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="hidden">
      <div id="sidebarHeader">
        <h2>✦ السجلات</h2>
        <button class="icon-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <input type="text" id="searchInput" placeholder="ابحث..." oninput="renderList()">
      <div id="filterRow">
        <button class="flt-btn active" id="fAll" onclick="setFilter('all')">الكل</button>
        <button class="flt-btn" id="fToday" onclick="setFilter('today')">اليوم</button>
        <button class="flt-btn" id="fWeek" onclick="setFilter('week')">الأسبوع</button>
        <button class="flt-btn" id="fMind" onclick="setFilter('mind')">🌿 الخرائط</button>
      </div>
      <div id="entryList"><div style="color:var(--text-faint);font-size:12px;text-align:center;padding:30px">جاري التحميل...</div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════
   CONFIG
════════════════════════════════════════════ */
const API   = 'https://script.google.com/macros/s/AKfycbwDuAZbCi0Gls71mcZtkHJo0-CpAvO41QFo7pbGZ2YV3SwC8yMMjIWqjhjQGu8pF3iN/exec';
const PASS  = '8435';

/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let allEntries = [], activeFilter = 'all', currentMode = 'editor';
let activeEntryId = null;
let sidebarOpen = false;

/* ════════════════════════════════════════════
   LOCK
════════════════════════════════════════════ */
function checkPass(){
  const v = document.getElementById('passInput').value;
  if(v === PASS){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    loadEntries();
    mindInit();
  } else {
    const inp = document.getElementById('passInput');
    inp.classList.add('error');
    document.getElementById('lockError').textContent = 'كلمة المرور غير صحيحة';
    inp.value = '';
    setTimeout(() => inp.classList.remove('error'), 600);
  }
}
document.getElementById('passInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPass(); });

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const setStatus = (type, msg) => { $('statusDot').className='status-dot '+type; $('statusText').textContent=msg; };
const showToast = (msg, type='') => {
  const t=$('toast'); t.textContent=msg; t.className='show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2800);
};
const apiCall = p => fetch(API+'?'+new URLSearchParams(p).toString()).then(r=>r.json());
const fmtTime = ts => new Date(Number(ts)).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
const fmtDate = ts => new Date(Number(ts)).toLocaleDateString('ar-EG',{month:'short',day:'numeric'});
const isToday = ts => new Date(Number(ts)).toDateString() === new Date().toDateString();
const isWeek  = ts => (Date.now()-Number(ts))/(864e5) <= 7;

/* ════════════════════════════════════════════
   MODE
════════════════════════════════════════════ */
function setMode(mode){
  currentMode = mode;
  $('modeEditor').classList.toggle('active', mode==='editor');
  $('modeMind').classList.toggle('active', mode==='mind');
  $('editorPane').classList.toggle('hidden', mode!=='editor');
  $('mindPane').classList.toggle('hidden', mode!=='mind');
  $('fmtBar').style.display = mode==='editor' ? 'flex' : 'none';
  if(mode==='mind'){
    requestAnimationFrame(()=>{
      if(mindNodes.length===1 && mindNodes[0].x===0 && mindNodes[0].y===0){
        centerMind();
      }
      mindRender();
    });
  }
}

/* ════════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════════ */
function toggleSidebar(){
  sidebarOpen = !sidebarOpen;
  $('sidebar').classList.toggle('hidden', !sidebarOpen);
  $('sideOverlay').classList.toggle('show', sidebarOpen);
  $('sidebarToggle').classList.toggle('active', sidebarOpen);
  if(sidebarOpen) renderList();
}
function setFilter(f){
  activeFilter = f;
  ['All','Today','Week','Mind'].forEach(x => $('f'+x)?.classList.remove('active'));
  const map = {all:'All',today:'Today',week:'Week',mind:'Mind'};
  $('f'+map[f])?.classList.add('active');
  renderList();
}

/* ════════════════════════════════════════════
   API
════════════════════════════════════════════ */
async function loadEntries(){
  setStatus('loading','جاري التحميل...');
  try{
    const res = await apiCall({action:'get'});
    if(!res.ok) throw new Error(res.error);
    allEntries = res.data.sort((a,b)=>Number(b.ts)-Number(a.ts));
    setStatus('ok','متصل');
    if(sidebarOpen) renderList();
  } catch(e){
    setStatus('err','خطأ في الاتصال');
    showToast('خطأ: '+e.message,'error');
  }
}

/* ════════════════════════════════════════════
   SIDEBAR LIST
════════════════════════════════════════════ */
function renderList(){
  const q = $('searchInput').value.trim().toLowerCase();
  let list = [...allEntries];
  if(activeFilter==='today') list=list.filter(e=>isToday(e.ts));
  if(activeFilter==='week')  list=list.filter(e=>isWeek(e.ts));
  if(activeFilter==='mind')  list=list.filter(e=>e.text.startsWith('MIND::'));
  if(q) list=list.filter(e=>e.text.toLowerCase().includes(q));
  if(!list.length){
    $('entryList').innerHTML=`<div style="color:var(--text-faint);font-size:12px;text-align:center;padding:30px">لا توجد سجلات</div>`;
    return;
  }
  $('entryList').innerHTML = list.map(e=>{
    const isMind = e.text.startsWith('MIND::');
    const preview = isMind ? '🌿 خريطة ذهنية' : e.text.replace(/<[^>]*>/g,'').slice(0,80);
    const active = activeEntryId===e.id ? ' active' : '';
    return `<div class="entry-item${active}" onclick="openEntry('${e.id}')">
      <span class="ei-badge ${isMind?'mind':'text'}">${isMind?'🌿 خريطة':'✦ نص'}</span>
      <div class="ei-preview">${preview}</div>
      <div class="ei-time">${fmtDate(e.ts)} · ${fmtTime(e.ts)}</div>
      <button class="ei-del" onclick="event.stopPropagation();deleteEntry('${e.id}')" title="حذف">×</button>
    </div>`;
  }).join('');
}

════════════════════════════════════════════ */
function openEntry(id){
  const e = allEntries.find(x=>x.id===id);
  if(!e) return;
  activeEntryId = id;
  if(e.text.startsWith('MIND::')){
    setMode('mind');
    mindLoadFromSerial(e.text.slice(6));
  } else {
    setMode('editor');
    $('editor').innerHTML = e.text;
    updateCounts();
  }
  renderList();
  if(window.innerWidth < 768) toggleSidebar();
}
function newEntry(){
  activeEntryId = null;
  if(currentMode==='editor'){
    $('editor').innerHTML='';
    updateCounts();
    $('editor').focus();
  } else {
    mindInit();
  }
}

  if(!html || html==='<br>'){showToast('اكتب شيئاً أولاً','error');return;}
  $('saveEntryBtn').disabled = true;

  try{

async function deleteEntry(id){
  if(!confirm('هل تريد حذف هذا السجل نهائياً؟')) return;

  try{
    const res = await apiCall({action:'delete', id});

    setStatus('err','فشل الحذف');
    showToast('خطأ: '+e.message,'error');
  }
}

/* ════════════════════════════════════════════
   ══════════ MIND MAP ENGINE ══════════
════════════════════════════════════════════ */

/* Data model */
let mindNodes = [];
let mindNextId = 1;
let mindSelected = null;
let mindDragging = null;
let mindDragOffset = {x:0,y:0};
let mindPan = {x:0,y:0};
let mindPanning = false;
let mindPanStart = {x:0,y:0};
let mindPanOrigin = {x:0,y:0};

const SVG_NS = 'http://www.w3.org/2000/svg';
const mindSvg = $('mindSvg');
const mindCanvas = $('mindCanvas');

/* Colors per depth */
const NODE_COLORS = ['#c9a84c','#6b9bc9','#6bc98a','#9b6bc9','#c96b6b','#c9846b','#6bc9c9'];
/* Padding inside ellipse */
const PAD_X = 18, PAD_Y = 10;
/* Font sizes per depth */
const FONT_SIZES = [14,12,11,10];
/* Max text width before wrapping (px) */
const MAX_TW = [160,130,110,90];

function nodeColor(depth){ return NODE_COLORS[depth % NODE_COLORS.length]; }
function nodeFontSize(depth){ return FONT_SIZES[Math.min(depth, FONT_SIZES.length-1)]; }
function nodeMaxW(depth){ return MAX_TW[Math.min(depth, MAX_TW.length-1)]; }

function nodeDepth(id){
  let d=0, n=mindNodes.find(x=>x.id===id);
  while(n && n.parentId!=null){ d++; n=mindNodes.find(x=>x.id===n.parentId); }
  return d;
}

/* Measure text into wrapped lines given max pixel width */
function wrapText(label, fontSize, maxW){
  /* Use a temporary SVG text to measure */
  const tmp = document.createElementNS(SVG_NS,'text');
  tmp.setAttribute('font-family','Cairo, sans-serif');
  tmp.setAttribute('font-size', fontSize);
  tmp.style.visibility='hidden';
  mindSvg.appendChild(tmp);
  const words = label.split('');  /* split by char for Arabic */
  /* Actually split by spaces for better wrapping */
  const wordArr = label.split(' ');
  const lines = [];
  let current = '';
  for(const w of wordArr){
    const test = current ? current+' '+w : w;
    tmp.textContent = test;
    if(tmp.getComputedTextLength() > maxW && current){
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  /* Measure max line width */
  let maxLineW = 0;
  for(const l of lines){
    tmp.textContent = l;
    maxLineW = Math.max(maxLineW, tmp.getComputedTextLength());
  }
  mindSvg.removeChild(tmp);
  return {lines, maxLineW};
}

/* Compute ellipse radii for a node based on its label */
function nodeRadii(n){
  const depth = nodeDepth(n.id);
  const fs = nodeFontSize(depth);
  const maxW = nodeMaxW(depth);
  const {lines, maxLineW} = wrapText(n.label, fs, maxW);
  const lineH = fs * 1.5;
  const textH = lines.length * lineH;
  const rx = Math.max(40, maxLineW/2 + PAD_X);
  const ry = Math.max(22, textH/2 + PAD_Y);
  return {rx, ry, lines, lineH, fs};
}

/* Get point on ellipse border in direction (dx,dy) */
function ellipseBorderPoint(cx, cy, rx, ry, dx, dy){
  if(dx===0 && dy===0) return {x:cx, y:cy};
  /* parametric: x=rx*cos(t), y=ry*sin(t), find t where direction matches */
  const angle = Math.atan2(dy*rx, dx*ry);
  return {
    x: cx + rx * Math.cos(angle),
    y: cy + ry * Math.sin(angle)
  };
}

function mindInit(){
  mindNodes = [{id:1,label:'الفكرة الرئيسية',x:0,y:0,parentId:null,collapsed:false}];
  mindNextId = 2;
  mindSelected = null;
  mindPan = {x:0,y:0};
  /* defer centering until canvas has dimensions */
  requestAnimationFrame(()=>{ centerMind(); mindRender(); });
}

function centerMind(){
  const rect = mindCanvas.getBoundingClientRect();
  mindPan = {x: rect.width/2, y: rect.height/2};
}

function mindRender(){
  mindSvg.innerHTML = '';

  const defs = document.createElementNS(SVG_NS,'defs');
  defs.innerHTML = `<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
    <feFlood flood-color="#c9a84c" flood-opacity="0.45" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;
  mindSvg.appendChild(defs);

  const g = document.createElementNS(SVG_NS,'g');
  mindSvg.appendChild(g);

  const visibleNodes = getVisibleNodes();
  const visibleIds = new Set(visibleNodes.map(n=>n.id));

  /* Pre-compute radii for all visible nodes */
  const radiiMap = {};
  visibleNodes.forEach(n=>{ radiiMap[n.id] = nodeRadii(n); });

  /* edges — drawn FIRST so nodes appear on top */
  const eGroup = document.createElementNS(SVG_NS,'g');
  visibleNodes.forEach(n=>{
    if(n.parentId==null || !visibleIds.has(n.parentId)) return;
    const parent = mindNodes.find(x=>x.id===n.parentId);
    if(!parent) return;

    const depth = nodeDepth(n.id);
    const col = nodeColor(depth-1);

    const pcx = parent.x+mindPan.x, pcy = parent.y+mindPan.y;
    const ncx = n.x+mindPan.x,      ncy = n.y+mindPan.y;

    /* Direction vectors */
    const dx = ncx - pcx, dy = ncy - pcy;

    /* Border points */
    const pr = radiiMap[parent.id] || {rx:40,ry:22};
    const nr = radiiMap[n.id]      || {rx:40,ry:22};

    const startPt = ellipseBorderPoint(pcx, pcy, pr.rx, pr.ry, dx, dy);
    const endPt   = ellipseBorderPoint(ncx, ncy, nr.rx, nr.ry, -dx, -dy);

    /* Bezier control points */
    const mx = (startPt.x + endPt.x) / 2;
    const path = document.createElementNS(SVG_NS,'path');
    path.setAttribute('d',`M${startPt.x},${startPt.y} C${mx},${startPt.y} ${mx},${endPt.y} ${endPt.x},${endPt.y}`);
    path.setAttribute('stroke', col);
    path.setAttribute('stroke-opacity','0.45');
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('fill','none');
    eGroup.appendChild(path);
  });
  g.appendChild(eGroup);

  /* nodes */
  visibleNodes.forEach(n=>{
    const depth = nodeDepth(n.id);
    const col = nodeColor(depth);
    const nx = n.x+mindPan.x, ny = n.y+mindPan.y;
    const isSel = n.id===mindSelected;
    const hasChildren = mindNodes.some(c=>c.parentId===n.id);
    const {rx, ry, lines, lineH, fs} = radiiMap[n.id];

    const nGroup = document.createElementNS(SVG_NS,'g');
    nGroup.setAttribute('class','mind-node');
    nGroup.style.cursor = 'pointer';
    nGroup.dataset.nid = n.id;

    /* ellipse */
    const ellipse = document.createElementNS(SVG_NS,'ellipse');
    ellipse.setAttribute('cx', nx);
    ellipse.setAttribute('cy', ny);
    ellipse.setAttribute('rx', rx);
    ellipse.setAttribute('ry', ry);
    ellipse.setAttribute('fill', col+'1a');
    ellipse.setAttribute('stroke', col);
    ellipse.setAttribute('stroke-width', isSel?'2.5':'1.5');
    if(isSel) ellipse.setAttribute('filter','url(#glow)');
    nGroup.appendChild(ellipse);

    /* wrapped text lines */
    const totalH = lines.length * lineH;
    const startY = ny - totalH/2 + lineH * 0.75;
    lines.forEach((line, i)=>{
      const tspan = document.createElementNS(SVG_NS,'text');
      tspan.setAttribute('x', nx);
      tspan.setAttribute('y', startY + i*lineH);
      tspan.setAttribute('text-anchor','middle');
      tspan.setAttribute('fill', col);
      tspan.setAttribute('font-family','Cairo, sans-serif');
      tspan.setAttribute('font-size', fs);
      tspan.setAttribute('font-weight', depth===0?'700':'500');
      tspan.textContent = line;
      nGroup.appendChild(tspan);
    });

    /* collapse indicator dot */
    if(hasChildren){
      const indG = document.createElementNS(SVG_NS,'g');
      const ix = nx + rx - 2, iy = ny - ry + 2;
      const circ = document.createElementNS(SVG_NS,'circle');
      circ.setAttribute('cx', ix); circ.setAttribute('cy', iy);
      circ.setAttribute('r','7');
      circ.setAttribute('fill', n.collapsed ? col : col+'55');
      circ.setAttribute('stroke', col); circ.setAttribute('stroke-width','1');
      const itxt = document.createElementNS(SVG_NS,'text');
      itxt.setAttribute('x', ix); itxt.setAttribute('y', iy+4);
      itxt.setAttribute('text-anchor','middle');
      itxt.setAttribute('fill', n.collapsed?'#0d0d0f':col);
      itxt.setAttribute('font-size','9'); itxt.setAttribute('font-weight','700');
      itxt.textContent = n.collapsed ? '+' : '−';
      indG.appendChild(circ); indG.appendChild(itxt);
      /* Click on indicator toggles collapse */
      indG.style.cursor='pointer';
      indG.addEventListener('click', e=>{ e.stopPropagation(); n.collapsed=!n.collapsed; mindRender(); });
      nGroup.appendChild(indG);
    }

    /* events */
    nGroup.addEventListener('mousedown', e => onNodeMouseDown(e, n.id));
    nGroup.addEventListener('click', e => { e.stopPropagation(); selectNode(n.id); });
    nGroup.addEventListener('dblclick', e => { e.stopPropagation(); openNodeEdit(n.id); });
    g.appendChild(nGroup);
  });
}

function getVisibleNodes(){
  const visible = [];
  const hidden = new Set();
  const sorted = topoSort(mindNodes);
  sorted.forEach(n=>{
    if(n.parentId!=null && hidden.has(n.parentId)){
      hidden.add(n.id);
      return;
    }
    visible.push(n);
    if(n.collapsed) hidden.add(n.id);
  });
  return visible;
}

function topoSort(nodes){
  const result=[], visited=new Set();
  function visit(n){
    if(visited.has(n.id)) return; visited.add(n.id);
    if(n.parentId!=null){ const p=nodes.find(x=>x.id===n.parentId); if(p) visit(p); }
    result.push(n);
  }
  nodes.forEach(visit);
  return result;
}

/* Select */
function selectNode(id){
  mindSelected = id;
  mindRender();
}

/* Node operations */
function mindAddChild(){
  const pid = mindSelected || (mindNodes[0]?.id);
  if(!pid) return;
  const parent = mindNodes.find(n=>n.id===pid);
  if(!parent) return;
  const depth = nodeDepth(pid);
  const siblings = mindNodes.filter(n=>n.parentId===pid);
  const angle = depth===0
    ? (siblings.length * Math.PI*0.45) - Math.PI*0.7
    : getAngleFromParent(parent) + (siblings.length * 0.55);
  const dist = 200 - depth*15;
  const newNode = {
    id: mindNextId++,
    label: 'فكرة جديدة',
    x: parent.x + Math.cos(angle)*dist,
    y: parent.y + Math.sin(angle)*dist,
    parentId: pid,
    collapsed: false
  };
  mindNodes.push(newNode);
  mindSelected = newNode.id;
  mindRender();
  openNodeEdit(newNode.id);
}
function getAngleFromParent(node){
  const parent = mindNodes.find(n=>n.id===node.parentId);
  if(!parent) return 0;
  return Math.atan2(node.y-parent.y, node.x-parent.x);
}
function mindAddSibling(){
  if(!mindSelected) return;
  const sel = mindNodes.find(n=>n.id===mindSelected);
  if(!sel || sel.parentId==null){ mindAddChild(); return; }
  const pid = sel.parentId;
  const parent = mindNodes.find(n=>n.id===pid);
  const baseAngle = getAngleFromParent(sel);
  const dist = Math.hypot(sel.x-parent.x, sel.y-parent.y);
  const newNode = {
    id: mindNextId++,
    label: 'فكرة جديدة',
    x: parent.x + Math.cos(baseAngle+0.6)*dist,
    y: parent.y + Math.sin(baseAngle+0.6)*dist,
    parentId: pid,
    collapsed: false
  };
  mindNodes.push(newNode);
  mindSelected = newNode.id;
  mindRender();
  openNodeEdit(newNode.id);
}
function mindToggleCollapse(){
  if(!mindSelected) return;
  const n = mindNodes.find(x=>x.id===mindSelected);
  if(!n) return;
  n.collapsed = !n.collapsed;
  mindRender();
}
function mindDeleteSelected(){
  if(!mindSelected) return;
  const sel = mindNodes.find(n=>n.id===mindSelected);
  if(!sel) return;
  if(sel.parentId===null && mindNodes.length===1){ showToast('لا يمكن حذف الجذر','error'); return; }
  /* delete node and all descendants */
  const toDelete = new Set();
  function markDelete(id){ toDelete.add(id); mindNodes.filter(n=>n.parentId===id).forEach(c=>markDelete(c.id)); }
  markDelete(mindSelected);
  mindNodes = mindNodes.filter(n=>!toDelete.has(n.id));
  mindSelected = sel.parentId || (mindNodes[0]?.id);
  closeNodeEdit();
  mindRender();
}
function mindReset(){
  if(!confirm('مسح الخريطة الحالية وبدء جديدة؟')) return;
  activeEntryId = null;
  mindInit();
}

/* Node Edit Popup */
let editingNodeId = null;
function openNodeEdit(id){
  editingNodeId = id;
  const n = mindNodes.find(x=>x.id===id);
  if(!n) return;
  const box = $('nodeEditBox');
  const inp = $('nodeEditInput');
  inp.value = n.label;
  const rect = mindCanvas.getBoundingClientRect();
  /* compute ellipse ry to position below node */
  const {ry} = nodeRadii(n);
  const nx = n.x + mindPan.x;
  const ny = n.y + mindPan.y + ry + 10;
  const left = Math.min(Math.max(nx - rect.left - 90, 8), rect.width - 210);
  const top  = Math.min(Math.max(ny - rect.top, 8), rect.height - 100);
  box.style.display = 'flex';
  box.style.left = left + 'px';
  box.style.top  = top + 'px';
  setTimeout(()=>inp.select(),50);
}
function closeNodeEdit(){
  $('nodeEditBox').style.display = 'none';
  editingNodeId = null;
}
function confirmNodeEdit(){
  if(!editingNodeId) return;
  const n = mindNodes.find(x=>x.id===editingNodeId);
  if(n) n.label = $('nodeEditInput').value.trim() || n.label;
  closeNodeEdit();
  mindRender();
}
function nodeEditKey(e){
  if(e.key==='Enter') confirmNodeEdit();
  if(e.key==='Escape') closeNodeEdit();
}

/* Drag nodes */
function onNodeMouseDown(e, id){
  e.stopPropagation();
  if(e.button!==0) return;
  const n = mindNodes.find(x=>x.id===id);
  if(!n) return;
  mindDragging = n;
  const rect = mindCanvas.getBoundingClientRect();
  mindDragOffset = {
    x: e.clientX - rect.left - (n.x+mindPan.x),
    y: e.clientY - rect.top  - (n.y+mindPan.y)
  };
}

/* Pan canvas */
mindCanvas.addEventListener('mousedown', e=>{
  if(e.button===0 && !mindDragging){
    mindPanning=true;
    mindPanStart={x:e.clientX,y:e.clientY};
    mindPanOrigin={...mindPan};
    mindCanvas.classList.add('grabbing');
  }
});
window.addEventListener('mousemove', e=>{
  if(mindDragging){
    const rect = mindCanvas.getBoundingClientRect();
    mindDragging.x = e.clientX - rect.left - mindPan.x - mindDragOffset.x;
    mindDragging.y = e.clientY - rect.top  - mindPan.y - mindDragOffset.y;
    mindRender();
  } else if(mindPanning){
    mindPan.x = mindPanOrigin.x + (e.clientX-mindPanStart.x);
    mindPan.y = mindPanOrigin.y + (e.clientY-mindPanStart.y);
    mindRender();
  }
});
window.addEventListener('mouseup', ()=>{
  mindDragging=null;
  mindPanning=false;
  mindCanvas.classList.remove('grabbing');
});
mindCanvas.addEventListener('click', ()=>{ selectNode(null); closeNodeEdit(); });

/* Touch support */
let touchStartPos=null;
mindCanvas.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    touchStartPos={x:e.touches[0].clientX,y:e.touches[0].clientY};
    mindPanStart={...touchStartPos};
    mindPanOrigin={...mindPan};
    mindPanning=true;
  }
},{passive:true});
mindCanvas.addEventListener('touchmove', e=>{
  if(mindPanning && e.touches.length===1){
    mindPan.x = mindPanOrigin.x + (e.touches[0].clientX-mindPanStart.x);
    mindPan.y = mindPanOrigin.y + (e.touches[0].clientY-mindPanStart.y);
    mindRender();
  }
},{passive:true});
mindCanvas.addEventListener('touchend', ()=>{ mindPanning=false; });

/* ══ SERIALIZATION ══ */
function mindSerialize(){
  return JSON.stringify({nodes:mindNodes, nextId:mindNextId, pan:mindPan});
}
function mindLoadFromSerial(serial){
  try{
    const data = JSON.parse(serial);
    mindNodes = data.nodes || [];
    mindNextId = data.nextId || (Math.max(0,...mindNodes.map(n=>n.id))+1);
    mindPan = data.pan || {x:0,y:0};
    mindSelected = null;
    /* center if pan not saved */
    if(!data.pan) centerMind();
    mindRender();
  } catch(e){ mindInit(); }
}
async function saveMindEntry(){
  if(!mindNodes.length){ showToast('الخريطة فارغة','error'); return; }
  const text = 'MIND::' + mindSerialize();
  setStatus('loading','جاري الحفظ...');
  $('mindSavebtn').textContent = '...';
  try{
    let res;
    if(activeEntryId){
      res = await apiCall({action:'edit', id:activeEntryId, text});
    } else {
      res = await apiCall({action:'add', text, ts:Date.now()});
    }
    if(!res.ok) throw new Error(res.error);
    showToast('🌿 تمّ حفظ الخريطة','success');
    activeEntryId = null;
    await loadEntries();
    if(sidebarOpen) renderList();
  } catch(e){
    setStatus('err','فشل الحفظ');
    showToast('خطأ: '+e.message,'error');
  } finally {
    $('mindSavebtn').textContent = '🌿 حفظ الخريطة';
  }
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
window.addEventListener('resize', ()=>{ if(currentMode==='mind') mindRender(); });
</script>
