<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>أنا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0f;--surface:#141417;--surface2:#1c1c21;--surface3:#232329;
  --border:#2a2a32;--border-glow:#3a3a48;
  --text:#e8e6f0;--text-muted:#7a7890;--text-faint:#3d3c50;
  --accent:#c9a84c;--accent-dim:#8a6e2e;--accent-glow:rgba(201,168,76,0.12);
  --red:#c96b6b;--red-dim:rgba(201,107,107,0.15);
  --green:#6bc98a;--blue:#6b9bc9;--purple:#9b6bc9;
  --mono:'IBM Plex Mono',monospace;--sans:'Cairo',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);}

#lockScreen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 40px 40px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:lockIn .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes lockIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.lock-icon{font-size:2.4rem;margin-bottom:18px;display:block;}
.lock-title{font-size:1.5rem;font-weight:700;margin-bottom:6px;}
.lock-sub{font-size:.82rem;color:var(--text-muted);margin-bottom:28px;}
#passInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:13px 18px;color:var(--text);font-family:var(--mono);font-size:1.3rem;letter-spacing:6px;text-align:center;outline:none;transition:border-color .2s;caret-color:var(--accent);margin-bottom:10px;}
#passInput:focus{border-color:var(--accent-dim);}
#passInput.error{border-color:var(--red);animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lockError{font-size:.8rem;color:var(--red);margin-bottom:14px;min-height:18px;}
.lock-btn{width:100%;background:var(--accent);color:#0d0d0f;border:none;border-radius:10px;padding:13px;font-family:var(--sans);font-size:1rem;font-weight:700;cursor:pointer;}
.lock-btn:active{transform:scale(.98);}

#app{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;}
#app.visible{display:flex;}

#topBar{height:48px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100;}
.app-title{font-size:1rem;font-weight:700;background:linear-gradient(135deg,#e8e6f0,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-left:auto;}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .18s;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.icon-btn:hover{border-color:var(--border-glow);color:var(--text);background:var(--surface2);}
.icon-btn:active{transform:scale(.92);}
.icon-btn.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow);}
.icon-btn svg, .fmt-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.sep{width:1px;height:24px;background:var(--border);flex-shrink:0;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0;transition:background .4s;}
.status-dot.ok{background:var(--green);}
.status-dot.err{background:var(--red);}
.status-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#statusText{font-size:11px;color:var(--text-faint);font-family:var(--mono);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

#workspace{flex:1;display:flex;overflow:hidden;position:relative;min-height:0;}

#editorPane{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-width:0;}
#editorPane.hidden{display:none;}

#fmtBar{height:40px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
#fmtBar::-webkit-scrollbar{display:none;}
.fmt-btn{height:28px;min-width:28px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text-muted);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .15s;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;user-select:none;}
.fmt-btn:hover{background:var(--surface2);border-color:var(--border);color:var(--text);}
.fmt-btn:active{transform:scale(.92);}
.fmt-btn.active{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent);}
.fmt-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0;}

.title-container{padding:16px 48px 12px;background:var(--bg);flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
#entryTitle{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:6px 0;color:var(--accent);font-family:var(--sans);font-size:1.2rem;font-weight:700;outline:none;transition:border-color .2s;}
#entryTitle:focus{border-color:var(--accent-dim);}
#entryTitle::placeholder{color:var(--text-faint);font-weight:500;}
#entryTags{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:4px 0;color:var(--text-muted);font-family:var(--sans);font-size:0.9rem;outline:none;transition:border-color .2s;}
#entryTags:focus{border-color:var(--accent-dim);color:var(--text);}
#entryTags::placeholder{color:var(--text-faint);}
@media(max-width:600px){.title-container{padding:14px 18px 8px;}}

.color-picker-container{position:relative;display:inline-block;}
#colorDropdown{display:none;position:fixed;background:var(--surface3);border:1px solid var(--border-glow);border-radius:8px;padding:8px;gap:8px;z-index:350;box-shadow:0 8px 24px rgba(0,0,0,.6);align-items:center;}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:transform .15s;flex-shrink:0;}
.color-dot:hover,.color-dot:active{transform:scale(1.25);}
.color-dot.active{border-color:white;transform:scale(1.1);}

#editor{flex:1;overflow-y:auto;padding:12px 48px 36px;outline:none;font-size:1.05rem;line-height:1.9;caret-color:var(--accent);color:var(--text);-webkit-overflow-scrolling:touch;}
#editor:empty::before{content:attr(data-placeholder);color:var(--text-faint);pointer-events:none;}
#editor b,#editor strong{font-weight:700;}
#editor u{text-decoration:underline;}
@media(max-width:600px){#editor{padding:10px 18px 20px;font-size:1rem;}}

#editorFooter{height:44px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px;}
#editingBadge{display:none;align-items:center;gap:6px;font-size:10px;color:var(--accent);font-family:var(--mono);background:var(--accent-glow);border:1px solid var(--accent-dim);border-radius:4px;padding:3px 8px;flex-shrink:0;}
#editingBadge.visible{display:flex;}
#editingBadge .cancel-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;line-height:1;padding:0;}
#charCount{font-size:11px;color:var(--text-faint);font-family:var(--mono);white-space:nowrap;}
#saveEntryBtn{background:var(--accent);color:#0d0d0f;border:none;border-radius:6px;padding:6px 14px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
#saveEntryBtn:active{transform:scale(.95);}
#saveEntryBtn:disabled{opacity:.4;cursor:not-allowed;}

#mindPane{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
#mindPane.hidden{display:none;}
#mindCanvas{flex:1;width:100%;cursor:grab;position:relative;overflow:hidden;touch-action:none;}
#mindCanvas.grabbing{cursor:grabbing;}
#mindCanvas svg{position:absolute;inset:0;width:100%;height:100%;}
#mindToolbar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap;}
.mind-btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.mind-btn:active{transform:scale(.94);}
#mindSavebtn{background:var(--accent);color:#0d0d0f;border:none;border-radius:7px;padding:6px 16px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
#mindSavebtn:active{transform:scale(.95);}

.node-fo-wrap{position:absolute;pointer-events:none;display:none;z-index:300;background:var(--surface);border:1.5px solid var(--accent-dim);border-radius:12px;padding:10px;box-shadow:0 12px 36px rgba(0,0,0,.5);width:220px;}
.node-fo-wrap.active{display:block;pointer-events:all;}
.node-fo-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;padding:6px 10px;resize:none;caret-color:var(--accent);overflow:hidden;text-align:right;line-height:1.5;}
.node-fo-hint{font-size:10px;color:var(--text-faint);text-align:center;margin-top:6px;font-family:var(--mono);}

#sidebar{width:min(300px,90vw);flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.16,1,.3,1);position:absolute;right:0;top:0;bottom:0;z-index:200;transform:translateX(0);box-shadow:-8px 0 32px rgba(0,0,0,.4);}
#sidebar.hidden{transform:translateX(110%);}
#sidebarHeader{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#sidebarHeader h2{font-size:.95rem;font-weight:700;color:var(--accent);}
#searchInput{width:calc(100% - 32px);margin:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s;flex-shrink:0;}
#searchInput:focus{border-color:var(--accent-dim);}
#searchInput::placeholder{color:var(--text-faint);}
#filterRow{display:flex;gap:4px;padding:0 16px 8px;flex-wrap:wrap;flex-shrink:0;}
#hashtagRow{display:none;gap:4px;padding:0 16px 10px;flex-wrap:wrap;flex-shrink:0;max-height:65px;overflow-y:auto;border-bottom:1px solid var(--border);}
.flt-btn{font-size:11px;font-weight:600;padding:5px 10px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-muted);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}
.flt-btn:active{transform:scale(.94);}
.flt-btn.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow);}

#entryList{flex:1;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch;}
.entry-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .18s;position:relative;-webkit-tap-highlight-color:transparent;}
.entry-item:hover {border-color:var(--border-glow);}
.entry-item:active{opacity:.8;}
.entry-item.active{border-color:var(--accent-dim);background:var(--accent-glow);}
.entry-item.is-pinned{border-color:var(--accent-dim);box-shadow:inset 0 0 8px rgba(201,168,76,0.05);}
.ei-relative-date{position:absolute;top:12px;left:12px;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-glow);border:1px solid var(--accent-dim);padding:2px 6px;border-radius:4px;font-family:var(--sans);}
.ei-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:6px;letter-spacing:.5px;margin-top:18px;}
.ei-badge.text{background:rgba(201,168,76,.1);color:var(--accent);}
.ei-badge.mind{background:rgba(107,155,201,.1);color:var(--blue);}
.ei-preview{font-size:11px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ei-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.ei-card-tag{font-size:10px;font-weight:600;background:var(--surface3);color:var(--accent);border:1px solid var(--border);padding:1px 6px;border-radius:4px;}
.ei-time{font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-top:6px;font-weight:700;}

.ei-actions-panel {position:absolute;bottom:10px;left:10px;display:flex;gap:4px;opacity:0;transition:opacity 0.15s;}
.entry-item:hover .ei-actions-panel {opacity:1;}
.ei-act-btn {width:24px;height:24px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 0.15s;}
.ei-act-btn:hover {border-color:var(--border-glow);color:var(--text);}
.ei-act-btn.pin-btn.active {color:var(--accent);border-color:var(--accent-dim);background:var(--accent-glow);}
.ei-act-btn.del-btn:hover {border-color:var(--red)!important;color:var(--red)!important;background:var(--red-dim)!important;}
@media(hover:none){.ei-actions-panel{opacity:0.6;}}

#confirmDialog{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);padding:20px;}
#confirmDialog.show{display:flex;}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.6);animation:lockIn .25s cubic-bezier(.16,1,.3,1) both;}
.confirm-box p{font-size:.95rem;color:var(--text-muted);margin-bottom:20px;line-height:1.6;}
.confirm-actions{display:flex;gap:8px;}
.confirm-yes{flex:1;background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;}
.confirm-no{flex:1;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;}

#sideOverlay{position:absolute;inset:0;z-index:199;display:none;background:rgba(0,0,0,.4);}
#sideOverlay.show{display:block;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface3);border:1px solid var(--border-glow);color:var(--text);font-size:13px;font-weight:600;padding:9px 20px;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:999;transition:transform .3s,opacity .3s;opacity:0;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.success{border-color:var(--green);color:var(--green);}
#toast.error{border-color:var(--red);color:var(--red);}

::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border-glow);border-radius:2px;}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon">🔒</span>
    <div class="lock-title">أنا</div>
    <div class="lock-sub">أدخل كلمة المرور للدخول</div>
    <input type="password" id="passInput" maxlength="10" placeholder="••••" autocomplete="off" autofocus>
    <div id="lockError"></div>
    <button class="lock-btn" onclick="checkPass()">دخول</button>
  </div>
</div>

<div id="confirmDialog">
  <div class="confirm-box">
    <p id="confirmMsg">هل تريد الحذف?</p>
    <div class="confirm-actions">
      <button class="confirm-yes" onclick="confirmYes()">تأكيد</button>
      <button class="confirm-no" onclick="confirmNo()">إلغاء</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="topBar">
    <button class="icon-btn active" id="modeEditor" onclick="setMode('editor')" title="محرر النصوص">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
    <button class="icon-btn" id="modeMind" onclick="setMode('mind')" title="الخريطة الذهنية">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 9V3M12 21v-6M9 12H3M21 12h-6M5.6 5.6l3 3M15.4 15.4l3 3M18.4 5.6l-3 3M8.6 15.4l-3 3"/></svg>
    </button>
    <div class="sep"></div>
    <button class="icon-btn" onclick="newEntry()" title="سجل جديد">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="icon-btn" id="sidebarToggle" onclick="toggleSidebar()" title="السجلات">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <div class="sep"></div>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">...</span>
    <div class="app-title">أنا ✦</div>
  </div>

  <div id="workspace">
    <div id="editorPane">
      <div id="fmtBar">
        <button class="fmt-btn" id="fmtBold" onmousedown="event.preventDefault();" onclick="execFmt('bold')"><b>ع</b></button>
        <button class="fmt-btn" id="fmtUnder" onmousedown="event.preventDefault();" onclick="execFmt('underline')"><u>ع</u></button>
        <div class="fmt-sep"></div>
        
        <button class="fmt-btn" onmousedown="event.preventDefault();" onclick="execFontSize('up')" title="تكبير الخط" style="font-size:14px;">A+</button>
        <button class="fmt-btn" onmousedown="event.preventDefault();" onclick="execFontSize('down')" title="تصغير الخط" style="font-size:11px;">A-</button>
        <div class="fmt-sep"></div>

        <div class="color-picker-container">
          <button class="fmt-btn" id="colorToggleBtn" title="تغيير لون الخط" onmousedown="event.preventDefault();" onclick="toggleColorDropdown(event)">
            <svg viewBox="0 0 24 24"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.03444 19.1759 5.09911 19.431 5.02164 19.6706L4.70014 20.6625C4.54284 21.1479 4.90113 21.6358 5.40556 21.5637L6.75704 21.3706C7.00998 21.3345 7.26189 21.4326 7.42436 21.6247C8.75612 22.5065 10.3201 22 12 22Z"/><circle cx="7.5" cy="10.5" r="1" fill="currentColor"/><circle cx="11.5" cy="7.5" r="1" fill="currentColor"/><circle cx="16.5" cy="9.5" r="1" fill="currentColor"/></svg>
          </button>
          <div id="colorDropdown">
            <div class="color-dot active" id="cdDefault" style="background:var(--text)" onmousedown="event.preventDefault();" onclick="setColor('')"></div>
            <div class="color-dot" id="cdGold" style="background:#c9a84c" onmousedown="event.preventDefault();" onclick="setColor('#c9a84c')"></div>
            <div class="color-dot" id="cdBlue" style="background:#6b9bc9" onmousedown="event.preventDefault();" onclick="setColor('#6b9bc9')"></div>
            <div class="color-dot" id="cdGreen" style="background:#6bc98a" onmousedown="event.preventDefault();" onclick="setColor('#6bc98a')"></div>
            <div class="color-dot" id="cdRed" style="background:#c96b6b" onmousedown="event.preventDefault();" onclick="setColor('#c96b6b')"></div>
            <div class="color-dot" id="cdPurple" style="background:#9b6bc9" onmousedown="event.preventDefault();" onclick="setColor('#9b6bc9')"></div>
          </div>
        </div>
        
        <span style="font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-right:auto;flex-shrink:0" id="wordCount">0 كلمة</span>
      </div>

      <div class="title-container">
        <input type="text" id="entryTitle" placeholder="عنوان السجل (اختياري)..." autocomplete="off">
        <input type="text" id="entryTags" placeholder="الهاشتاقات مستقلة (مثال: #عمل #أفكار)..." autocomplete="off">
      </div>

        <button class="flt-btn" id="fToday" onclick="setFilter('today')">اليوم</button>

<div id="toast"></div>

<script>
const API  = 'https://script.google.com/macros/s/AKfycbwDuAZbCi0Gls71mcZtkHJo0-CpAvO41QFo7pbGZ2YV3SwC8yMMjIWqjhjQGu8pF3iN/exec';
const PASS = '8435';

let allEntries=[], activeFilter='all', selectedHashtag=null, currentMode='editor';
let activeEntryId=null, sidebarOpen=false, lastEditorRange=null;

/* 🌟 مستمع ذكي لتحويل الشرطة (-) تلقائياً إلى فاصلة عربية (،) دون التأثير على المؤشر */
document.addEventListener('beforeinput', function(e) {
  if (e.data === '-') {
    e.preventDefault();
    if (e.target.id === 'editor') {
      document.execCommand('insertText', false, '،');
    } else if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      const val = e.target.value;
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      e.target.value = val.slice(0, start) + '،' + val.slice(end);
      e.target.setSelectionRange(start + 1, start + 1);
    }
  }
});

/* التركيز التلقائي فور تحميل الصفحة */
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const inp = document.getElementById('passInput');
    if(inp) inp.focus();
  }, 100);
});

/* Helpers للتحقق من السجلات المثبتة بالدبوس */
function isPinned(text) { return text.startsWith(''); }
function stripPin(text) { return text.startsWith('') ? text.replace('', '') : text; }

/* Confirm dialog */
let _confirmResolve=null;
function showConfirm(msg){
  return new Promise(res=>{
    _confirmResolve=res;
    document.getElementById('confirmMsg').textContent=msg;
    document.getElementById('confirmDialog').classList.add('show');
  });
}
function confirmYes(){document.getElementById('confirmDialog').classList.remove('show');if(_confirmResolve)_confirmResolve(true);_confirmResolve=null;}
function confirmNo(){document.getElementById('confirmDialog').classList.remove('show');if(_confirmResolve)_confirmResolve(false);_confirmResolve=null;}

/* Lock */
function checkPass(){
  const v=document.getElementById('passInput').value;
  if(v===PASS){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').classList.add('visible');
    loadEntries();
    mindInit();
  } else {
    const inp=document.getElementById('passInput');
    inp.classList.add('error');
    document.getElementById('lockError').textContent='كلمة المرور غير صحيحة';
    inp.value='';
    setTimeout(()=>inp.classList.remove('error'),600);
  }
}
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPass();});

const $=id=>document.getElementById(id);
const setStatus=(type,msg)=>{$('statusDot').className='status-dot '+type;$('statusText').textContent=msg;};
const showToast=(msg,type='')=>{
  const t=$('toast');t.textContent=msg;t.className='show '+type;
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2800);
};
const apiCall=p=>fetch(API+'?'+new URLSearchParams(p).toString()).then(r=>r.json());

/* التاريخ والوقت */
const fmtTime=ts=>new Date(Number(ts)).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const fmtDate=ts=>{const d=new Date(Number(ts));const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();};
const isToday=ts=>new Date(Number(ts)).toDateString()===new Date().toDateString();
const isWeek=ts=>(Date.now()-Number(ts))/(864e5)<=7;
const escHtml=s=>s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';

function getRelativeDateStr(ts) {
  const d1 = new Date(); d1.setHours(0,0,0,0);
  const d2 = new Date(Number(ts)); d2.setHours(0,0,0,0);
  const diffDays = Math.round((d1 - d2) / 864e5);
  if (diffDays === 0) return "اليوم";
  if (diffDays === 1) return "أمس";
  if (diffDays === 2) return "قبل 2 يوم";
  if (diffDays > 2 && diffDays < 30) return `قبل ${diffDays} يوم`;
  if (diffDays >= 30 && diffDays < 365) {
    const m = Math.floor(diffDays / 30);
    return m === 1 ? "قبل شهر" : `قبل ${m} شهر`;
  }
  const y = Math.floor(diffDays / 365);
  return y === 1 ? "قبل سنة" : `قبل ${y} سنة`;
}

/* Mode */
function setMode(mode){
  currentMode=mode;
  $('modeEditor').classList.toggle('active',mode==='editor');
  $('modeMind').classList.toggle('active',mode==='mind');
  $('editorPane').classList.toggle('hidden',mode!=='editor');
  $('mindPane').classList.toggle('hidden',mode!=='mind');
  if(mode==='mind'){
    requestAnimationFrame(()=>{
      mindRender();
    });
  }
}

/* Sidebar */
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  $('sidebar').classList.toggle('hidden',!sidebarOpen);
  $('sideOverlay').classList.toggle('show',sidebarOpen);
  $('sidebarToggle').classList.toggle('active',sidebarOpen);
  if(sidebarOpen) renderList();
}
function closeSidebar(){
  if(!sidebarOpen)return;
  sidebarOpen=false;
  $('sidebar').classList.add('hidden');
  $('sideOverlay').classList.remove('show');
  $('sidebarToggle').classList.remove('active');
}
function setFilter(f){
  activeFilter=f;
  ['fAll','fToday','fWeek','fMind'].forEach(x=>$(x)&&$(x).classList.remove('active'));
  ({all:'fAll',today:'fToday',week:'fWeek',mind:'fMind'})[f] && $({all:'fAll',today:'fToday',week:'fWeek',mind:'fMind'}[f]).classList.add('active');
  renderList();
}
function toggleHashtagFilter(tag){
  selectedHashtag = (selectedHashtag === tag) ? null : tag;
  renderList();
}

/* API */
async function loadEntries(){
  setStatus('loading','جاري التحميل...');
  try{
    const res=await apiCall({action:'get'});
    if(!res.ok)throw new Error(res.error||'خطأ');
    allEntries=(res.data||[]).map(e=>({...e,id:String(e.id)})).sort((a,b)=>{
      // فرز وتثبيت الدبوس بالقمة دائماً
      const pinA = isPinned(a.text);
      const pinB = isPinned(b.text);
      if(pinA && !pinB) return -1;
      if(!pinA && pinB) return 1;
      return Number(b.ts) - Number(a.ts);
    });
    setStatus('ok','متصل ✓');
    if(sidebarOpen)renderList();
  }catch(e){
    setStatus('err','خطأ');
    showToast('خطأ في الاتصال: '+e.message,'error');
  }
}

/* التبديل السريع للتثبيت (الدبوس) */
async function togglePin(id, event) {
  event.stopPropagation();
  const e = allEntries.find(x => x.id === id);
  if(!e) return;
  let newText = e.text;
  if(isPinned(newText)) {
    newText = stripPin(newText);
  } else {
    newText = '' + newText;
  }
  setStatus('loading', 'جاري التعديل...');
  try {
    const res = await apiCall({action:'edit', id: id, text: newText});
    if(!res.ok) throw new Error(res.error);
    showToast(isPinned(newText) ? 'تم التثبيت في الأعلى 📌' : 'تم إلغاء التثبيت');
    await loadEntries();
  } catch(err) {
    setStatus('err', 'خطأ');
    showToast('خطأ: ' + err.message, 'error');
  }
}

/* معالجة النصوص واستخراج الميتا داتا والهاشتاقات */
function parseEntryMetadata(textStr) {
  let textBody = stripPin(textStr);
  let title = '';
  let tagsStr = '';
  
  const titleMatch = textBody.match(/^/);
  if(titleMatch) {
    title = titleMatch[1];
    textBody = textBody.replace(/^/, '');
  }
  
  const tagsMatch = textBody.match(/^/);
  if(tagsMatch) {
    tagsStr = tagsMatch[1];
    textBody = textBody.replace(/^/, '');
  }
  
  let tagsArray = [];
  if(tagsStr) {
    tagsArray = tagsStr.match(/#[^\s<>\#!.,;:\"']+/g) || [];
  }
  
  return { title, tagsStr, tagsArray, textBody, pinned: isPinned(textStr) };
}

/* List & Hashtag Rendering */
function renderList(){
  const q=$('searchInput').value.trim().toLowerCase();
  let foundTags = new Set();
  
  allEntries.forEach(e => {
    const cleanText = stripPin(e.text);
    if(!cleanText.startsWith('MIND::')){
      const meta = parseEntryMetadata(e.text);
      meta.tagsArray.forEach(t => foundTags.add(t));
    }
  });

  const hashRow = $('hashtagRow');
  if(foundTags.size > 0){
    hashRow.style.display = 'flex';
    hashRow.innerHTML = Array.from(foundTags).map(t => {
      const act = selectedHashtag === t ? ' active' : '';
      return `<span class="flt-btn${act}" onclick="toggleHashtagFilter('${t}')">${t}</span>`;
    }).join('');
  } else {
    hashRow.style.display = 'none';
  }

  let list=[...allEntries];
  if(activeFilter==='today')list=list.filter(e=>isToday(e.ts));
  if(activeFilter==='week')list=list.filter(e=>isWeek(e.ts));
  if(activeFilter==='mind')list=list.filter(e=>stripPin(e.text).startsWith('MIND::'));
  
  if(selectedHashtag){
    list = list.filter(e => {
      if(stripPin(e.text).startsWith('MIND::')) return false;
      const meta = parseEntryMetadata(e.text);
      return meta.tagsArray.includes(selectedHashtag);
    });
  }
  
  if(q){
    list=list.filter(e=>e.text.toLowerCase().includes(q));
  }
  
  if(!list.length){
    $('entryList').innerHTML='<div style="color:var(--text-faint);font-size:12px;text-align:center;padding:40px">لا توجد سجلات</div>';
    return;
  }
  
  $('entryList').innerHTML=list.map(e=>{
    const cleanText = stripPin(e.text);
    const isMind=cleanText.startsWith('MIND::');
    const pinned = isPinned(e.text);
    let preview = '';
    let entryTitle = '';
    let tagsArray = [];

    if(isMind){
      try{
        const data=JSON.parse(cleanText.slice(6));
        const rootNode=data.nodes&&data.nodes.find(n=>n.parentId===null);
        preview='🌿 '+(rootNode?rootNode.label:'خريطة ذهنية');
      }catch(err){preview='🌿 خريطة ذهنية';}
    } else {
      const meta = parseEntryMetadata(e.text);
      entryTitle = meta.title;
      tagsArray = meta.tagsArray;
      preview = escHtml(meta.textBody.replace(/<[^>]*>/g,'').slice(0,80));
    }
    
    const active=activeEntryId===e.id?' active':'';
    const pinClass=pinned?' is-pinned':'';
    const tagsHtml = tagsArray.map(t => `<span class="ei-card-tag">${t}</span>`).join('');

    return `<div class="entry-item${active}${pinClass}" onclick="openEntry('${e.id}')">
      <div class="ei-relative-date">${getRelativeDateStr(e.ts)}</div>
      <span class="ei-badge ${isMind?'mind':'text'}">${isMind?'🌿 خريطة':'✦ نص'} ${pinned?' · 📌 مثبت':''}</span>
      ${entryTitle ? `<div style="font-size:13px; font-weight:700; color:var(--text); margin-top:4px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📌 ${escHtml(entryTitle)}</div>` : ''}
      <div class="ei-preview">${preview}</div>
      ${tagsHtml ? `<div class="ei-card-tags">${tagsHtml}</div>` : ''}
      <div class="ei-time">📅 ${fmtDate(e.ts)} · ⏰ ${fmtTime(e.ts)}</div>
      <div class="ei-actions-panel">
        <button class="ei-act-btn pin-btn ${pinned?'active':''}" title="تثبيت" onclick="togglePin('${e.id}', event)">📌</button>
        <button class="ei-act-btn del-btn" title="حذف" onclick="event.stopPropagation();deleteEntry('${e.id}')">×</button>
      </div>
    </div>`;
  }).join('');
}

/* Open entry */
function openEntry(id){
  const e=allEntries.find(x=>String(x.id)===String(id));
  if(!e){showToast('لم يُعثر على السجل','error');return;}
  activeEntryId=String(id);
  const cleanText = stripPin(e.text);

  if(cleanText.startsWith('MIND::')){
    setMode('mind');
    mindLoadFromSerial(cleanText.slice(6));
  } else {
    setMode('editor');
    const meta = parseEntryMetadata(e.text);
    $('entryTitle').value=meta.title;
    $('entryTags').value=meta.tagsStr;
    
    const editorEl=$('editor');
    editorEl.innerHTML=meta.textBody;
    updateCounts();
    $('editingBadge').classList.add('visible');
    setTimeout(()=>{
      editorEl.focus();
      saveEditorSelection();
    },60);
  }
  renderList();
  closeSidebar();
}

function cancelEdit(){
  activeEntryId=null;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  $('cdDefault').classList.add('active');
  $('entryTitle').value='';
  $('entryTags').value='';
  $('editor').innerHTML='';
  $('editingBadge').classList.remove('visible');
  updateCounts();
  showToast('تمّ إلغاء التعديل');
}

function newEntry(){
  activeEntryId=null;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  $('cdDefault').classList.add('active');
  $('editingBadge').classList.remove('visible');
  $('entryTitle').value='';
  $('entryTags').value='';
  if(currentMode==='editor'){
    $('editor').innerHTML='';
    updateCounts();
    setTimeout(()=>$('editor').focus(),50);
  } else {
    mindInit();
  }
  closeSidebar();
}

/* ══ Editor Core ══ */
const editor=$('editor');
editor.addEventListener('input', ()=>{ updateCounts(); saveEditorSelection(); });
editor.addEventListener('keyup', ()=>{ updateFmtBtns(); saveEditorSelection(); });
editor.addEventListener('mouseup', ()=>{ updateFmtBtns(); saveEditorSelection(); });
editor.addEventListener('click', saveEditorSelection);
editor.addEventListener('touchend', ()=>{ updateFmtBtns(); saveEditorSelection(); });

function saveEditorSelection(){
  const sel = window.getSelection();
  if(sel.rangeCount > 0){
    const range = sel.getRangeAt(0);
    if(editor.contains(range.commonAncestorContainer)){
      lastEditorRange = range.cloneRange();
    }
  }
}

function updateCounts(){
  const text=editor.innerText||'';
  $('charCount').textContent=text.length+' حرف';
  $('wordCount').textContent=(text.trim()?text.trim().split(/\s+/).length:0)+' كلمة';
}
function updateFmtBtns(){
  try{
    $('fmtBold').classList.toggle('active',document.queryCommandState('bold'));
    $('fmtUnder').classList.toggle('active',document.queryCommandState('underline'));
  }catch(e){}
}

function execFmt(cmd){
  editor.focus();
  if(lastEditorRange){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(lastEditorRange);
  }
  document.execCommand(cmd,false,null);
  updateFmtBtns();
  saveEditorSelection();
}

function toggleColorDropdown(e) {
  e.stopPropagation();
  const d = $('colorDropdown');
  if (d.style.display === 'flex') {
    d.style.display = 'none';
  } else {
    d.style.display = 'flex';
    const btn = $('colorToggleBtn');
    const rect = btn.getBoundingClientRect();
    d.style.top = (rect.bottom + 6) + 'px';
    const rightSpace = window.innerWidth - rect.right;
    d.style.right = rightSpace + 'px';
    d.style.left = 'auto';
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('.color-picker-container')) {
    $('colorDropdown').style.display = 'none';
  }
});

function setColor(color){
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  editor.focus();
  if(lastEditorRange){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(lastEditorRange);
  }
  if(!color){
    $('cdDefault').classList.add('active');
    document.execCommand('foreColor', false, 'var(--text)');
  } else {
    const id={'#c9a84c':'cdGold','#6b9bc9':'cdBlue','#6bc98a':'cdGreen','#c96b6b':'cdRed','#9b6bc9':'cdPurple'}[color];
    if(id)$(id).classList.add('active');
    document.execCommand('foreColor', false, color);
  }
  $('colorDropdown').style.display = 'none';
  saveEditorSelection();
}

function execFontSize(action) {
  editor.focus();
  if(lastEditorRange){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(lastEditorRange);
  }
  const sel = window.getSelection();
  if(!sel.rangeCount) return;
  
  let range = sel.getRangeAt(0);
  let parent = range.commonAncestorContainer;
  if(parent.nodeType === 3) parent = parent.parentNode;
  
  let currentSize = window.getComputedStyle(parent).fontSize;
  let sizeNum = parseFloat(currentSize) || 17;
  
  if(action === 'up') { sizeNum += 2; } else { sizeNum = Math.max(10, sizeNum - 2); }
  
  if(!sel.isCollapsed) {
    const contents = range.extractContents();
    const span = document.createElement('span');
    span.style.fontSize = sizeNum + 'px';
    span.appendChild(contents);
    range.insertNode(span);
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(newRange);
  } else {
    const span = document.createElement('span');
    span.style.fontSize = sizeNum + 'px';
    span.innerHTML = '&#8203;'; 
    range.insertNode(span);
    const newRange = document.createRange();
    newRange.setStart(span.firstChild, 1);
    newRange.setEnd(span.firstChild, 1);
    sel.removeAllRanges();
    sel.addRange(newRange);
  }
  saveEditorSelection();
  updateCounts();
}

async function saveEditorEntry(){
  let html=editor.innerHTML.trim();
  const title=$('entryTitle').value.trim();
  const tags=$('entryTags').value.trim();
  
  if((!html||html==='<br>') && !title && !tags){showToast('أدخل بيانات لحفظ السجل','error');return;}
  
  if(tags) { html = `` + html; }
  if(title) { html = `` + html; }

  // إذا كان السجل الحالي في الأصل مثبتاً، نحافظ عليه عند الحفظ
  if(activeEntryId) {
    const old = allEntries.find(x => x.id === activeEntryId);
    if(old && isPinned(old.text)) html = '' + html;
  }

  $('saveEntryBtn').disabled=true;
  $('saveEntryBtn').textContent='...';
  setStatus('loading','جاري الحفظ...');
  try{
    let res;
    if(activeEntryId){
      res=await apiCall({action:'edit',id:activeEntryId,text:html});
    } else {
      res=await apiCall({action:'add',text:html,ts:Date.now()});
    }
    if(!res.ok)throw new Error(res.error||'خطأ في الحفظ');
    showToast(activeEntryId?'✦ تمّ التعديل':'✦ تمّ الحفظ','success');
    activeEntryId=null;
    $('editingBadge').classList.remove('visible');
    $('entryTitle').value='';
    $('entryTags').value='';
    editor.innerHTML='';
    updateCounts();
    setStatus('ok','محفوظ ✓');
    await loadEntries();
  }catch(e){
    setStatus('err','فشل الحفظ');
    showToast('خطأ: '+e.message,'error');
  } finally{
    $('saveEntryBtn').disabled=false;
    $('saveEntryBtn').textContent='✦ حفظ';
  }
}

async function deleteEntry(id){
  const ok=await showConfirm('هل تريد حذف هذا السجل نهائياً؟');
  if(!ok)return;
  setStatus('loading','جاري الحذف...');
  try{
    const res=await apiCall({action:'delete',id});
    if(!res.ok)throw new Error(res.error||'خطأ');
    showToast('تمّ الحذف');
    if(activeEntryId===String(id)){
      activeEntryId=null;
      $('editingBadge').classList.remove('visible');
      $('entryTitle').value='';
      $('entryTags').value='';
      editor.innerHTML='';
      updateCounts();
    }
    await loadEntries();
  }catch(e){
    setStatus('err','خطأ');
    showToast('فشل الحذف: '+e.message,'error');
  }
}

/* ══ الخريطة الذهنية المتكاملة والديناميكية ══ */
let mindNodes=[], selectedNodeId=null, mindPanX=0, mindPanY=0;
let isPanning=false, startX=0, startY=0;

function mindInit(){
  mindNodes=[{id:1, parentId:null, label:'الفكرة الرئيسية', desc:'', x:0, y:0, collapsed:false}];
  selectedNodeId=1;
  mindRender();
}

function mindRender(){
  const svg = $('mindSvg');
  if(!svg) return;
  svg.innerHTML = '';
  
  const width = svg.clientWidth || window.innerWidth;
  const height = svg.clientHeight || window.innerHeight;
  const cx = width / 2 + mindPanX;
  const cy = height / 2 + mindPanY;
  
  const gMaster = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  gMaster.setAttribute('transform', `translate(${cx}, ${cy})`);
  svg.appendChild(gMaster);

  // رسم الخطوط الموصلة
  mindNodes.forEach(node => {
    if(node.parentId !== null){
      const parent = mindNodes.find(n => n.id === node.parentId);
      if(parent && !parent.collapsed && !isAncestorCollapsed(node)){
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', parent.x); line.setAttribute('y1', parent.y);
        line.setAttribute('x2', node.x); line.setAttribute('y2', node.y);
        line.setAttribute('stroke', 'var(--border-glow)');
        line.setAttribute('stroke-width', '2');
        gMaster.appendChild(line);
      }
    }
  });

  // رسم الدوائر والبطاقات
  mindNodes.forEach(node => {
    if(isAncestorCollapsed(node)) return;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${node.x}, ${node.y})`);
    
    g.addEventListener('click', (e) => { e.stopPropagation(); selectedNodeId=node.id; mindRender(); });
    g.addEventListener('dblclick', (e) => { e.stopPropagation(); showNodeOverlay(node); });

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    const isSelected = selectedNodeId === node.id;
    rect.setAttribute('fill', isSelected ? 'var(--accent-glow)' : 'var(--surface)');
    rect.setAttribute('stroke', isSelected ? 'var(--accent)' : 'var(--border)');
    rect.setAttribute('stroke-width', isSelected ? '2' : '1');
    rect.setAttribute('rx', '10'); rect.setAttribute('ry', '10');

    const txtLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txtLabel.textContent = node.label || '...';
    txtLabel.setAttribute('fill', 'var(--text)');
    txtLabel.setAttribute('font-size', '13px');
    txtLabel.setAttribute('font-weight', '600');
    txtLabel.setAttribute('text-anchor', 'middle');

    let txtDesc = null;
    if(node.desc) {
      txtDesc = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txtDesc.textContent = node.desc;
      txtDesc.setAttribute('fill', 'var(--text-muted)');
      txtDesc.setAttribute('font-size', '10px');
      txtDesc.setAttribute('text-anchor', 'middle');
    }

    g.appendChild(rect);
    g.appendChild(txtLabel);
    if(txtDesc) g.appendChild(txtDesc);
    gMaster.appendChild(g);

    // ضبط الأبعاد والمسافات تلقائياً بناءً على حجم النصوص والوصف التابع
    setTimeout(() => {
      try {
        const lB = txtLabel.getBBox();
        const dB = txtDesc ? txtDesc.getBBox() : {width:0, height:0};
        const w = Math.max(lB.width, dB.width) + 26;
        const h = node.desc ? 46 : 32;
        rect.setAttribute('x', -w/2); rect.setAttribute('y', -h/2);
        rect.setAttribute('width', w); rect.setAttribute('height', h);
        if(node.desc){
          txtLabel.setAttribute('y', -4);
          txtDesc.setAttribute('y', 13);
        } else {
          txtLabel.setAttribute('y', 4);
        }
      } catch(err){}
    }, 0);
  });
}

function isAncestorCollapsed(node){
  let pId = node.parentId;
  while(pId !== null){
    const p = mindNodes.find(n => n.id === pId);
    if(p && p.collapsed) return true;
    pId = p ? p.parentId : null;
  }
  return false;
}

/* لوحة تعديل الدائرة الفرعية والوصف */
let editingOverlayNode = null;
function showNodeOverlay(node){
  editingOverlayNode = node;
  const overlay = $('nodeEditOverlay');
  $('nodeEditTA').value = node.label || '';
  $('nodeEditDescTA').value = node.desc || '';
  overlay.classList.add('active');
  
  const svg = $('mindSvg');
  const rect = svg.getBoundingClientRect();
  const cx = rect.width / 2 + mindPanX + node.x;
  const cy = rect.height / 2 + mindPanY + node.y;
  
  overlay.style.right = 'auto';
  overlay.style.left = Math.min(window.innerWidth - 240, Math.max(20, cx - 110)) + 'px';
  overlay.style.top = Math.min(window.innerHeight - 150, Math.max(70, cy - 40)) + 'px';
  setTimeout(()=>$('nodeEditTA').focus(), 50);
}

function closeNodeOverlay(){
  if(!editingOverlayNode) return;
  editingOverlayNode.label = $('nodeEditTA').value.trim() || '...';
  editingOverlayNode.desc = $('nodeEditDescTA').value.trim();
  editingOverlayNode = null;
  $('nodeEditOverlay').classList.remove('active');
  mindRender();
}

// إغلاق النافذة والحفظ تلقائياً عند النقر في الخارج
$('mindCanvas').addEventListener('click', () => { if($('nodeEditOverlay').classList.contains('active')) closeNodeOverlay(); });
$('nodeEditOverlay').addEventListener('click', (e)=>e.stopPropagation());

document.addEventListener('keydown', (e)=>{
  if($('nodeEditOverlay').classList.contains('active')){
    if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeNodeOverlay(); }
    if(e.key === 'Escape') { editingOverlayNode=null; $('nodeEditOverlay').classList.remove('active'); mindRender(); }
  }
});

/* إدارة حركات وسحب الخريطة الذهنية */
const canvas = $('mindCanvas');
canvas.addEventListener('mousedown', (e) => {
  if(e.target.tagName === 'svg' || e.target.id === 'mindSvg') {
    isPanning = true;
    canvas.classList.add('grabbing');
    startX = e.clientX - mindPanX;
    startY = e.clientY - mindPanY;
  }
});
canvas.addEventListener('mousemove', (e) => {
  if(isPanning) {
    mindPanX = e.clientX - startX;
    mindPanY = e.clientY - startY;
    mindRender();
  }
});
window.addEventListener('mouseup', () => { isPanning = false; canvas.classList.remove('grabbing'); });

/* أزرار لوحة التحكم للخرائط */
function mindAddChild(){
  if(!selectedNodeId) return;
  const parent = mindNodes.find(n => n.id === selectedNodeId);
  if(!parent) return;
  const id = Date.now();
  const count = mindNodes.filter(n => n.parentId === selectedNodeId).length;
  mindNodes.push({
    id: id, parentId: selectedNodeId, label: 'فرع جديد', desc: '',
    x: parent.x + 150, y: parent.y + (count * 55) - 30, collapsed: false
  });
  selectedNodeId = id;
  mindRender();
}

function mindAddSibling(){
  if(!selectedNodeId) return;
  const node = mindNodes.find(n => n.id === selectedNodeId);
  if(!node || node.parentId === null) { showToast('لا يمكن إضافة مجاور للجذر الرئيسي', 'error'); return; }
  const id = Date.now();
  mindNodes.push({
    id: id, parentId: node.parentId, label: 'مجاور جديد', desc: '',
    x: node.x, y: node.y + 55, collapsed: false
  });
  selectedNodeId = id;
  mindRender();
}

function mindToggleCollapse(){
  if(!selectedNodeId) return;
  const node = mindNodes.find(n => n.id === selectedNodeId);
  if(node) { node.collapsed = !node.collapsed; mindRender(); }
}

function mindDeleteSelectedNode(){
  if(!selectedNodeId || selectedNodeId === 1) { showToast('لا يمكن حذف العقدة الرئيسية', 'error'); return; }
  mindNodes = mindNodes.filter(n => n.id !== selectedNodeId && n.parentId !== selectedNodeId);
  selectedNodeId = 1;
  mindRender();
}

async function mindResetConfirm(){
  if(await showConfirm('هل أنت متأكد من مسح الخريطة بالكامل والبدء من جديد؟')){ mindInit(); }
}

/* 📤 تصدير الخريطة كـ صورة عالية الدقة ومتجهة SVG */
function exportMindSvg() {
  const svgEl = $('mindSvg');
  if(!svgEl) return;
  
  // أخذ نسخة مستقلة وحساب الحواف الحقيقية لمنع قص الأطراف أثناء التصدير
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(clone);
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  
  const a = document.createElement('a');
  a.href = url;
  a.download = `خريطة_ذهنية-${Date.now()}.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('تم تصدير الخريطة بنجاح كملف SVG 🌿', 'success');
}

/* حفظ الخرائط وقراءتها */
async function saveMindEntry(){
  if(!mindNodes.length) return;
  let textData = 'MIND::' + JSON.stringify({nodes: mindNodes, panX: mindPanX, panY: mindPanY});
  
  // الحفاظ على حالة التثبيت إن وجدت مسبقاً
  if(activeEntryId) {
    const old = allEntries.find(x => x.id === activeEntryId);
    if(old && isPinned(old.text)) textData = '' + textData;
  }

  $('mindSavebtn').disabled = true;
  setStatus('loading','جاري حفظ الخريطة...');
  try{
    let res;
    if(activeEntryId){
      res = await apiCall({action:'edit', id:activeEntryId, text:textData});
    } else {
      res = await apiCall({action:'add', text:textData, ts:Date.now()});
    }
    if(!res.ok) throw new Error(res.error);
    showToast('تم حفظ الخريطة بنجاح 🌿','success');
    activeEntryId = null;
    setStatus('ok','محفوظ ✓');
    await loadEntries();
  }catch(e){
    setStatus('err','فشل الحفظ');
    showToast('خطأ: '+e.message,'error');
  }finally{
    $('mindSavebtn').disabled = false;
  }
}

function mindLoadFromSerial(serialStr){
  try{
    const data = JSON.parse(serialStr);
    mindNodes = data.nodes || [];
    mindPanX = data.panX || 0;
    mindPanY = data.panY || 0;
    selectedNodeId = mindNodes.length ? mindNodes[0].id : null;
    mindRender();
  }catch(err){
    showToast('فشل في تحميل بيانات الخريطة', 'error');
    mindInit();
  }
}
